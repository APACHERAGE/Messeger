# Private friends instance: one process serves the API and the built SPA.
# Enabled by scripts/share.sh. Do not use this profile for a public service.
app.auth.email-verification=${NIGHTFALL_EMAIL_VERIFICATION:off}
app.auth.invite-code=${NIGHTFALL_INVITE_CODE:}
app.auth.invite-required=${NIGHTFALL_INVITE_REQUIRED:false}
app.auth.public-url=${NIGHTFALL_PUBLIC_URL:http://127.0.0.1:8080}
app.mail.mode=${NIGHTFALL_MAIL_MODE:disabled}
app.web.static-dir=${NIGHTFALL_STATIC_DIR:../dist}
server.address=${NIGHTFALL_BIND:127.0.0.1}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${NIGHTFALL_COOKIE_SECURE:true}
