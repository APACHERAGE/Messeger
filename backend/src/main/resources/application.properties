spring.datasource.url=jdbc:h2:file:./nightfall;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
server.address=127.0.0.1
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${NIGHTFALL_COOKIE_SECURE:false}
app.auth.public-url=${NIGHTFALL_PUBLIC_URL:http://127.0.0.1:5173}
app.auth.public-url-file=${NIGHTFALL_PUBLIC_URL_FILE:}
app.mail.mode=${NIGHTFALL_MAIL_MODE:disabled}
app.mail.from=${NIGHTFALL_MAIL_FROM:no-reply@nightfall.local}
spring.mail.host=${NIGHTFALL_SMTP_HOST:localhost}
spring.mail.port=${NIGHTFALL_SMTP_PORT:587}
spring.mail.username=${NIGHTFALL_SMTP_USERNAME:}
spring.mail.password=${NIGHTFALL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${NIGHTFALL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${NIGHTFALL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${NIGHTFALL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Friend-feed uploads: per-file and request limits; media-specific limits are checked by the controller.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=31MB
